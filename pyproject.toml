[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench"
version = "0.1.0"
description = "Unified client, load generator and report tool for comparing vLLM and Triton + TensorRT-LLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6",
]

[project.optional-dependencies]
gateway = ["fastapi>=0.115", "uvicorn>=0.30"]
report = ["matplotlib>=3.9"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "matplotlib>=3.9"]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools.packages.find]
include = ["llmbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
